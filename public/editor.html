<!DOCTYPE html>
<html>
<head>

</head>
<body>
  <button id="theme-toggle" style="position:fixed;top:10px;right:10px;z-index:10;">🌙</button>

  <table>
    <tr>
      <td><a href="../../">Home</a></td>  
      <td><a href="/person/brody">Brody</a></td>
      <td><a href="/person/elizabeth">Elizabeth</a></td>

    right: 10px;

    cursor: pointer;
