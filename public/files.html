<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Files · Noter</title>
  <meta name="theme-color" content="#2f5fd0">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/app.css">
  <script src="/js/theme-init.js"></script>
  <style>
    .files-page { max-width: 880px; margin: 0 auto; padding: 20px 16px 80px; }
    .files-top { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
    .files-top h1 { flex: 1; margin: 0; font-size: 1.4rem; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-bottom: 16px; }
    .drop-zone {
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
      padding: 28px; border: 2px dashed var(--border); border-radius: 12px; color: var(--muted); cursor: pointer; text-align: center;
    }
    .drop-zone:hover, .drop-zone.dragover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
    .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
    .toolbar .input { max-width: 240px; }
    .crumbs { flex: 1; font-size: 0.92rem; color: var(--muted); }
    .crumbs a { text-decoration: none; }
    .file-row .icon { width: 20px; height: 20px; color: var(--muted); flex: none; }
    .file-row .actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
    .file-row.folder .primary-line { cursor: pointer; }
    .preview-text { white-space: pre-wrap; font-family: var(--mono); font-size: 0.85rem; background: var(--code-bg); padding: 12px; border-radius: 10px; max-height: 60vh; overflow: auto; margin: 0; }
    .preview-img { max-width: 100%; max-height: 65vh; display: block; margin: 0 auto; border-radius: 8px; }
    @media (max-width: 600px) { .file-row { flex-wrap: wrap; } .file-row .actions { width: 100%; justify-content: flex-start; } }
  </style>
</head>
<body>
  <div class="files-page">
    <div class="files-top">
      <a class="btn" href="/">← Notes</a>
      <h1>Shared files</h1>
      <button class="btn" id="lock-btn" hidden>Lock</button>
    </div>

    <div class="lock-card" id="locked" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      <h2>Files are password protected</h2>
      <p id="locked-note">Enter the files password.</p>
      <form id="unlock-form">
        <input class="input" type="password" id="password-input" placeholder="Password" aria-label="Password" autocomplete="current-password">
        <button class="btn primary" type="submit">Unlock</button>
      </form>
      <div class="form-error" id="password-status" role="alert"></div>
    </div>

    <div id="main-content" hidden>
      <div class="card">
        <label class="drop-zone" id="upload-area" tabindex="0">
          <strong>Drop files here or click to upload</strong>
          <span class="secondary-line">Files with the same name are kept side by side, never overwritten.</span>
          <input type="file" id="file-input" multiple hidden>
        </label>
        <div class="page-info" id="upload-status" role="status"></div>
      </div>

      <div class="card">
        <div class="toolbar">
          <nav class="crumbs" id="breadcrumb" aria-label="Folder"></nav>
          <input class="input" id="folder-name-input" placeholder="New folder name" aria-label="New folder name">
          <button class="btn" id="create-folder-btn">New folder</button>
        </div>
        <ul class="list" id="file-list" aria-live="polite"></ul>
      </div>
    </div>
  </div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script type="module" src="/js/files.js"></script>
</body>
</html>
